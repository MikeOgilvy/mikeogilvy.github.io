<script>
    (function () {
        if (window.__galleryLightbox) return;
        window.__galleryLightbox = true;

        var box = document.createElement("div");
        box.className = "gallery-lightbox";
        box.setAttribute("role", "dialog");
        box.setAttribute("aria-label", "Image viewer");
        box.innerHTML = '<span class="gallery-lightbox-close" aria-label="Close">×</span><img alt="">';
        document.body.appendChild(box);

        var big = box.querySelector("img");

        function close() {
            box.classList.remove("open");
            document.body.classList.remove("gallery-locked");
            big.removeAttribute("src");
        }

        document.addEventListener("click", function (e) {
            var link = e.target.closest && e.target.closest(".gallery-link");
            if (link) {
                e.preventDefault();
                var thumb = link.querySelector("img");
                big.src = link.getAttribute("href");
                big.alt = thumb ? thumb.alt : "";
                box.classList.add("open");
                document.body.classList.add("gallery-locked");
                return;
            }
            if (box.classList.contains("open")) close();
        });

        document.addEventListener("keydown", function (e) {
            if (e.key === "Escape" || e.keyCode === 27) close();
        });
    })();

    (function() {
        const profile = document.getElementById("dynamic-profile");
        if (!profile) return;

        
        function renderCalendar() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const today = now.getDate();

            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            document.getElementById("cal-header").innerText = `${monthNames[month]} ${year}`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const grid = document.getElementById("cal-grid");
            grid.innerHTML = "";

            for (let i = 0; i < firstDay; i++) {
                grid.innerHTML += '<span></span>';
            }

            for (let d = 1; d <= daysInMonth; d++) {
                const isToday = d === today ? 'background: #14b30f; color: white; border-radius: 4px; font-weight: bold;' : '';
                grid.innerHTML += `<span style="padding: 2px 0; ${isToday}">${d}</span>`;
            }
        }

        
        function updatePosition() {
            const mainContent = document.querySelector(".main");
            if (!mainContent || window.innerWidth < 1350) {
                
                
                profile.style.opacity = "0";
                profile.style.pointerEvents = "none";
                return;
            }
            const rect = mainContent.getBoundingClientRect();
            profile.style.left = (rect.left - 240) + "px";
            profile.style.top = "150px";
            profile.style.width = "200px";
            profile.style.opacity = "1";
            profile.style.pointerEvents = "auto";
        }

        renderCalendar();
        updatePosition();
        window.addEventListener("resize", updatePosition);
        window.addEventListener("scroll", updatePosition);
    })();
</script>

<script>
    (function() {
        var sidebar = document.getElementById("toc-sidebar");
        if (!sidebar) return;
        var links = sidebar.querySelectorAll("a");
        var headings = [];
        links.forEach(function(a) {
            var id = a.getAttribute("href");
            if (id && id.startsWith("#")) {
                var el = document.getElementById(id.slice(1));
                if (el) headings.push({ link: a, el: el });
            }
        });
        if (!headings.length) return;
        window.addEventListener("scroll", function() {
            var scrollPos = window.scrollY + 120;
            var active = null;
            headings.forEach(function(h) {
                if (h.el.offsetTop <= scrollPos) active = h.link;
            });
            links.forEach(function(a) { a.classList.remove("active"); });
            if (active) active.classList.add("active");
        });
    })();
</script>
