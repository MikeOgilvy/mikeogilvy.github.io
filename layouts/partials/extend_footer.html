<script>
    (function() {
        const profile = document.getElementById("dynamic-profile");
        if (!profile) return;

        // A. 渲染月历网格
        function renderCalendar() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const today = now.getDate();

            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            document.getElementById("cal-header").innerText = `${monthNames[month]} ${year}`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const grid = document.getElementById("cal-grid");
            grid.innerHTML = "";

            for (let i = 0; i < firstDay; i++) {
                grid.innerHTML += '<span></span>';
            }

            for (let d = 1; d <= daysInMonth; d++) {
                const isToday = d === today ? 'background: #14b30f; color: white; border-radius: 4px; font-weight: bold;' : '';
                grid.innerHTML += `<span style="padding: 2px 0; ${isToday}">${d}</span>`;
            }
        }

        // B. 动态定位函数
        function updatePosition() {
            const mainContent = document.querySelector(".main");
            if (!mainContent || window.innerWidth < 1350) {
                // 窄屏：光设 opacity:0 只是"看不见"，元素仍然会在左上角
                // 抢点击（命中它自己的社交链接）。必须同时掐掉 pointer-events。
                profile.style.opacity = "0";
                profile.style.pointerEvents = "none";
                return;
            }
            const rect = mainContent.getBoundingClientRect();
            profile.style.left = (rect.left - 240) + "px";
            profile.style.top = "150px";
            profile.style.width = "200px";
            profile.style.opacity = "1";
            profile.style.pointerEvents = "auto";
        }

        renderCalendar();
        updatePosition();
        window.addEventListener("resize", updatePosition);
        window.addEventListener("scroll", updatePosition);
    })();
</script>

<script>
    (function() {
        var sidebar = document.getElementById("toc-sidebar");
        if (!sidebar) return;
        var links = sidebar.querySelectorAll("a");
        var headings = [];
        links.forEach(function(a) {
            var id = a.getAttribute("href");
            if (id && id.startsWith("#")) {
                var el = document.getElementById(id.slice(1));
                if (el) headings.push({ link: a, el: el });
            }
        });
        if (!headings.length) return;
        window.addEventListener("scroll", function() {
            var scrollPos = window.scrollY + 120;
            var active = null;
            headings.forEach(function(h) {
                if (h.el.offsetTop <= scrollPos) active = h.link;
            });
            links.forEach(function(a) { a.classList.remove("active"); });
            if (active) active.classList.add("active");
        });
    })();
</script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const text = "{{ .Site.Params.description }}"; 
        const target = document.querySelector(".header-description") || document.querySelector(".description");
        
        if (target) {
            target.innerHTML = '<span class="typing-text"></span><span class="typing-cursor"></span>';
            const textContainer = target.querySelector(".typing-text");
            let i = 0;
            const speed = 100;

            function typeWriter() {
                if (i < text.length) {
                    textContainer.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(typeWriter, speed);
                }
            }
            typeWriter();
        }
    });
</script>

<style>
    .typing-cursor {
        display: inline-block;
        width: 2px;
        height: 1em;
        background-color: var(--primary);
        margin-left: 4px;
        animation: blink 0.7s infinite;
        vertical-align: middle;
    }
    @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
    }
</style>

<script>
    (function() {
        const path = window.location.pathname;
        
        // 增加判断：只要 body 有 single 类且路径包含 photography
        if (path.includes('/photography/') && (document.querySelector('.post-single') || document.body.classList.contains('single'))) {
            
            document.body.classList.add('photography-wide');

            const fixLayout = () => {
                // 1. 暴力拆除所有父级容器的宽度限制
                // 增加 .post-content 以确保它也能突破限制
                const containers = document.querySelectorAll('.container, .main, .post-single, .post-content');
                containers.forEach(el => {
                    el.style.maxWidth = '100% !important'; // 尝试强制覆盖
                    el.style.setProperty('max-width', '100%', 'important');
                    el.style.width = '100%';
                    el.style.margin = '0';
                    el.style.padding = '0';
                });
            };

            // 立即执行一次
            fixLayout();
            
            // 页面加载完成后再执行一次（处理异步图片加载）
            window.addEventListener('load', fixLayout);
            
            // 针对某些主题动态渲染，设置多重定时器保底
            setTimeout(fixLayout, 100);
            setTimeout(fixLayout, 1000); 
        }
    })();
</script>

<script>
    (function () {
        if (window.__imageLightboxInit) return;
        window.__imageLightboxInit = true;

        const lightbox = document.createElement('div');
        lightbox.className = 'image-lightbox';
        lightbox.hidden = true;
        lightbox.setAttribute('role', 'dialog');
        lightbox.setAttribute('aria-modal', 'true');
        lightbox.setAttribute('aria-label', '放大图片');
        lightbox.innerHTML = `
            <span class="image-lightbox__close" aria-label="关闭">&times;</span>
            <div class="image-lightbox__wrapper">
                <img class="image-lightbox__image" alt="">
                <div class="image-lightbox__caption"></div>
            </div>
        `;
        document.body.appendChild(lightbox);

        const enlargedImage = lightbox.querySelector('.image-lightbox__image');
        const captionEl = lightbox.querySelector('.image-lightbox__caption');
        let lastFocusedElement = null;
        let closeTimer;

        const close = () => {
            if (lightbox.hidden) return;
            lightbox.classList.remove('is-open');
            document.body.classList.remove('image-lightbox-open');
            window.clearTimeout(closeTimer);
            closeTimer = window.setTimeout(() => {
                lightbox.hidden = true;
                enlargedImage.removeAttribute('src');
                captionEl.textContent = '';
            }, 180);
            lastFocusedElement?.focus?.();
        };

        const open = (image) => {
            window.clearTimeout(closeTimer);
            lastFocusedElement = document.activeElement;

            const parentLink = image.closest('a');
            let fullSrc = image.currentSrc || image.src;
            if (parentLink && /\.(jpg|jpeg|png|webp|avif|gif)(\?.*)?$/i.test(parentLink.getAttribute('href') || '')) {
                fullSrc = parentLink.getAttribute('href');
            }

            let captionText = '';
            const fig = image.closest('figure');
            if (fig) {
                const figcap = fig.querySelector('figcaption');
                if (figcap) captionText = figcap.textContent.trim();
            }
            if (!captionText) {
                captionText = image.getAttribute('title') || image.getAttribute('alt') || '';
            }

            enlargedImage.src = fullSrc;
            enlargedImage.alt = image.alt || '';
            if (captionText) {
                captionEl.textContent = captionText;
                captionEl.style.display = 'block';
            } else {
                captionEl.textContent = '';
                captionEl.style.display = 'none';
            }

            lightbox.hidden = false;
            document.body.classList.add('image-lightbox-open');
            requestAnimationFrame(() => lightbox.classList.add('is-open'));
        };

        document.addEventListener('click', (event) => {
            const image = event.target.closest?.('.post-content img, .prose img');
            if (image) {
                if (image.closest('.gallery-link') || image.closest('.image-lightbox')) return;
                event.preventDefault();
                open(image);
                return;
            }
            if (event.target === lightbox || event.target === enlargedImage || event.target.closest?.('.image-lightbox__close')) {
                close();
            }
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' || event.keyCode === 27) close();
        });
    })();
</script>
